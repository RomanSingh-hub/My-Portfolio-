<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Artworks – RORO LAB</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Optional: video position tweaks */
    .video-shift-heading { object-position: center 15%; } 
    .video-shift-title   { object-position: center 8%;  }
  </style>
</head>
<body class="min-h-screen bg-black text-white">

  <!-- NAV -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-black/60 backdrop-blur border-b border-neutral-800">
    <div class="max-w-4xl mx-auto px-5 h-14 flex items-center justify-between">
      <div class="font-extrabold tracking-wider">
        <span class="text-cyan-400">RORO</span><span class="text-pink-400"> LAB</span>
      </div>
      <div class="hidden sm:flex gap-8 text-sm">
        <a href="index.html#home"  class="hover:text-cyan-400">HOME</a>
        <a href="index.html#about" class="hover:text-cyan-400">ABOUT</a>
        <a href="index.html#works" class="hover:text-cyan-400">WORKS</a>
      </div>
    </div>
  </nav>

  <!-- Spacer -->
  <div class="h-14"></div>

  <!-- PAGE -->
  <main class="max-w-4xl mx-auto px-5 py-8 space-y-8">

    <!-- ==== CARD 1: Header Clip (clickable) ==== -->
    <a href="collage.html" class="block group rounded-2xl border border-neutral-800 bg-neutral-900/40 shadow-lg overflow-hidden transition-transform duration-300 hover:scale-[1.01]">
      <section>
        <header class="px-5 pt-5">
          <h2 class="text-sm font-semibold text-neutral-300">Header Clip</h2>
        </header>

        <!-- Video -->
        <div class="relative mt-4">
          <div class="w-full h-[240px] sm:h-[300px] md:h-[360px]">
            <video
              class="absolute inset-0 w-full h-full object-cover video-shift-heading"
              src="final_pdf/artwork/heading.mp4"
              preload="auto"
              autoplay
              muted
              playsinline
              loop
            ></video>
          </div>
        </div>

        <!-- Content -->
        <div class="p-5">
          <img src="assets/collage/preview.jpg" alt="Collage Project" class="w-full rounded-lg mb-3 object-cover"/>
          <h3 class="text-lg font-bold text-cyan-400 group-hover:underline">Collage Project</h3>
          <p class="text-sm text-neutral-300">A creative 5-photo collage layout.</p>
          <button class="mt-3 px-4 py-2 bg-cyan-500 text-white text-sm font-semibold rounded-md shadow-md group-hover:bg-cyan-400">
            View Project
          </button>
        </div>
      </section>
    </a>

    <!-- ==== CARD 2: Rorochibi (clickable to Instagram) ==== -->
    <a href="https://www.instagram.com/rorochibi?igsh=OHUyMTR4dmpwMjZz" target="_blank" rel="noopener"
       class="block group rounded-2xl border border-neutral-800 bg-neutral-900/40 shadow-lg overflow-hidden transition-transform duration-300 hover:scale-[1.01]">
      <section>
        <header class="p-5 pb-0">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-cyan-400">Rorochibi</h2>
          <p class="text-neutral-300 mt-1 mb-4">Welcome to the sweet life of RORO…</p>
        </header>

        <!-- Video -->
        <div class="relative rounded-b-2xl overflow-hidden">
          <div class="w-full h-[280px] sm:h-[360px] md:h-[440px] lg:h-[520px]">
            <video
              id="video-title"
              class="absolute inset-0 w-full h-full object-cover video-shift-title transition-transform duration-300 group-hover:scale-[1.01]"
              src="final_pdf/artwork/roro_insta.mp4"
              preload="auto"
              autoplay
              muted
              playsinline
              loop
            ></video>
          </div>
        </div>
      </section>
    </a>

    <!-- ==== CARD 3: Gallery (clickable) ==== -->
    <a href="gallery.html" class="block group rounded-2xl border border-neutral-800 bg-neutral-900/40 shadow-lg overflow-hidden transition-transform duration-300 hover:scale-[1.01]">
      <section>
        <header class="p-5 pb-0">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-cyan-400">Gallery</h2>
          <p class="text-neutral-300 mt-1 mb-4">Paintings & drawings. Tap to view the full collection.</p>
        </header>

        <!-- Cover Image -->
        <div class="relative rounded-b-2xl overflow-hidden">
          <div class="w-full h-[200px] sm:h-[240px] md:h-[300px]">
            <img
              src="final_pdf/artwork/20250809_012123.jpg"
              alt="Skeleton hand with butterfly — gallery cover"
              class="absolute inset-0 w-full h-full object-cover transition-transform duration-300 group-hover:scale-[1.02]"
              loading="lazy"
            />
          </div>
        </div>
      </section>
    </a>

  </main>

  <!-- FOOTER -->
  <footer class="max-w-4xl mx-auto px-5 py-10 text-center text-neutral-400">
    <div class="font-extrabold text-lg mb-1">
      <span class="text-cyan-400">RORO</span><span class="text-pink-400"> LAB</span>
    </div>
    <p class="text-sm">Pushing the boundaries of digital creativity</p>
    <p class="text-xs text-neutral-500 mt-2">&copy; 2024 Roro Lab. All rights reserved.</p>
  </footer>

  <!-- Video autoplay helper -->
  <script>
    document.querySelectorAll('video[autoplay]').forEach(v=>{
      v.play().catch(()=>{/* ignore autoplay block */});
    });
  </script>
</body>
</html>
