<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Collage Photo Frame</title>

  <!-- You can remove Tailwind if you don’t use it elsewhere -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* =============== Base page =============== */
    :root{
      --rail-h: 12px;          /* top black bar height */
      --string-w: 2px;         /* hanging line thickness */
      --string-color: #111;    /* hanging line color */
      --frame: #111;           /* outer frame color */
      --matte: #fff;           /* inner white border */
      --bg: #f4f4f4;           /* page bg */
    }
    html,body{height:100%}
    body{
      margin:0; background:var(--bg);
      color:#111; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji","Segoe UI Emoji", "Segoe UI Symbol";
    }

    /* =============== Collage area =============== */
    .collage{
      /* centers the whole collage and controls max size */
      width:min(1000px, 92vw);
      margin: max(4vh,24px) auto;
      padding-top: clamp(60px, 12vh, 160px); /* space for the strings to hang */
      position:relative;
    }
    /* Top black rail */
    .rail{
      position:absolute; inset:0 auto auto 0;
      height:var(--rail-h); width:100%; background:#000;
      top:0;
    }

    /* 2 rows (top: small frames, bottom: big frames) */
    .grid{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: clamp(12px, 2.2vw, 24px);
      align-items:start;
    }

    /* A frame with double border look (outer frame + inner matte) */
    .frame{
      position:relative;
      aspect-ratio: 4 / 3;         /* adjust if your photos are taller/wider */
      border:4px solid var(--frame);
      padding:10px;                 /* “matte” space */
      background:#fff;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    .frame > .matte{
      position:absolute; inset:6px;
      border:6px solid var(--matte);
      pointer-events:none;
    }
    .frame img{
      position:absolute; inset:18px;
      width:calc(100% - 36px); height:calc(100% - 36px);
      object-fit:cover; display:block; background:#d9d9d9;
    }

    /* Small top frames */
    .small{ aspect-ratio: 5 / 4; }

    /* Hanging strings for the two small frames */
    .hanger{
      position:relative;
    }
    .hanger::before{
      content:"";
      position:absolute;
      left:50%; transform:translateX(-50%);
      top: calc(-1 * (clamp(60px, 12vh, 160px) - var(--rail-h)));
      /* The line runs from the rail down to the frame */
      height: calc(clamp(60px, 12vh, 160px) - var(--rail-h));
      width:var(--string-w);
      background:var(--string-color);
    }

    /* Layout placement:
       row 1: [small  -  empty  -  small]
       row 2: [big1   -  big2   -  big3] */
    .small-left   { grid-column: 1; }
    .small-right  { grid-column: 3; }
    .big-1        { grid-column: 1; }
    .big-2        { grid-column: 2; }
    .big-3        { grid-column: 3; }

    /* =============== Responsive tweaks =============== */
    @media (max-width: 760px){
      /* Stack nicely on phones: small frames first, then big ones */
      .grid{
        grid-template-columns: 1fr;
      }
      .small-left,.small-right,.big-1,.big-2,.big-3{ grid-column:auto; }
      .collage{ padding-top: 100px; }
      .hanger::before{
        top: -88px; height: 88px;  /* shorter strings on small screens */
      }
    }
  </style>
</head>
<body>

  <!-- Optional title -->
  <header class="text-center mb-6">
    <h1 class="text-3xl font-semibold tracking-tight">Collage Photo Frame</h1>
    <p class="text-sm text-gray-600">Five-image layout: two hanging, three grounded.</p>
  </header>

  <!-- Collage -->
  <section class="collage">
    <div class="rail" aria-hidden="true"></div>

    <div class="grid">
      <!-- Top row (two small hanging frames) -->
      <div class="hanger small-left">
        <figure class="frame small">
          <span class="matte" aria-hidden="true"></span>
          <!-- Replace the src below with your picture -->
          <img src="assets/collage/top-left.jpg" alt="Top-left photo" />
        </figure>
      </div>

      <div></div> <!-- empty middle cell on desktop -->

      <div class="hanger small-right">
        <figure class="frame small">
          <span class="matte" aria-hidden="true"></span>
          <img src="assets/collage/top-right.jpg" alt="Top-right photo" />
        </figure>
      </div>

      <!-- Bottom row (three larger frames) -->
      <figure class="frame big-1">
        <span class="matte" aria-hidden="true"></span>
        <img src="assets/collage/bottom-left.jpg" alt="Bottom-left photo" />
      </figure>

      <figure class="frame big-2">
        <span class="matte" aria-hidden="true"></span>
        <img src="assets/collage/bottom-center.jpg" alt="Bottom-center photo" />
      </figure>

      <figure class="frame big-3">
        <span class="matte" aria-hidden="true"></span>
        <img src="assets/collage/bottom-right.jpg" alt="Bottom-right photo" />
      </figure>
    </div>
  </section>

  <!-- Footer label (like in your sketch) -->
  <footer class="text-center mt-4 mb-10">
    <span class="block text-4xl font-semibold" style="font-family:cursive; color:#ff6a3d">Collage</span>
    <span class="block -mt-2 tracking-wide">Photo<br/>Frame</span>
  </footer>
</body>
</html>
