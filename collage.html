<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collage – Roman Singh</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    :root{ --rail-h:12px; --string:2px; --line:#111; }
    .collage-wrap{ width:min(1000px,92vw); margin:40px auto; padding-top:110px; position:relative; }
    .rail{ position:absolute; top:0; left:0; right:0; height:var(--rail-h); background:#000; }
    .grid{ display:grid; grid-template-columns: repeat(3, 1fr); gap:18px; }
    .frame{ position:relative; aspect-ratio:4/3; border:4px solid #111; background:#fff; }
    .frame img{ position:absolute; inset:10px; width:calc(100% - 20px); height:calc(100% - 20px); object-fit:cover; background:#d9d9d9; }
    .small{ aspect-ratio:5/4; }
    .hanger{ position:relative; }
    .hanger::before{ content:""; position:absolute; left:50%; transform:translateX(-50%); top:-98px; height:98px; width:var(--string); background:var(--line); }
    .small-left{ grid-column:1; } .small-right{ grid-column:3; }
    .big-1{ grid-column:1; } .big-2{ grid-column:2; } .big-3{ grid-column:3; }
    @media (max-width:760px){
      .grid{ grid-template-columns:1fr; }
      .hanger::before{ top:-70px; height:70px; }
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">Roman Singh</div>
      <ul class="nav-links">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#artwork">artwork</a></li>
      </ul>
    </nav>
  </header>

  <main class="collage-wrap">
    <div class="rail" aria-hidden="true"></div>
    <h1>Collage Photo Frame</h1>
    <p>Five-image layout: two hanging, three grounded.</p>

    <div class="grid">
      <!-- top small hanging -->
      <div class="hanger small-left">
        <figure class="frame small">
          <img src="assets/preview/DSC01138_enhanced.jpg" alt="Top left">
        </figure>
      </div>
      <div></div>
      <div class="hanger small-right">
        <figure class="frame small">
          <img src="assets/preview/DSC01140.JPG" alt="Top right">
        </figure>
      </div>

      <!-- bottom three -->
      <figure class="frame big-1"><img src="assets/preview/DSC01189.JPG"></figure>
      <figure class="frame big-2"><img src="assets/preview/SDC10726.JPG" alt="Bottom center"></figure>
      <figure class="frame big-3"><img src="assets/preview/SDC10746.JPG" alt="Bottom right"></figure>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 Roman Singh. All Rights Reserved.</p>
  </footer>
</body>
</html>
