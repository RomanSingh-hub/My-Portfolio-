<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collage – RoroLab</title>

  <!-- Tailwind only; no site CSS so index.html is untouched -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      --rail-h: 14px;
      --string-w: 3px;
      --string-color: #0f172a;
      --string-height: clamp(90px, 14vh, 160px);
    }

    body{ background:#000; color:#e5e7eb; }

    .rail{ position:absolute; top:0; left:0; right:0; height:var(--rail-h); background:#000; }

    .collage-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: clamp(16px, 2vw, 28px);
      align-items:start;
    }

    .frame{
      position:relative;
      aspect-ratio: 4 / 3;
      border:0;
      background:#000;
      box-shadow:none;
      overflow:hidden;
      border-radius: 8px;
    }

    .frame img{
      position:absolute; inset:0;
      width:100%; height:100%;
      object-fit: cover;
      object-position: center;
      background:#000;
      display:block;
    }

    .hanger{ position:relative; }
    .hanger::before{
      content:"";
      position:absolute; left:50%; transform:translateX(-50%);
      top: calc(-1 * (var(--string-height) - var(--rail-h)));
      height: calc(var(--string-height) - var(--rail-h));
      width: var(--string-w); background: var(--string-color);
    }

    .small-left{  grid-column: 1; }
    .small-right{ grid-column: 3; }
    .big-1{ grid-column: 1; }
    .big-2{ grid-column: 2; }
    .big-3{ grid-column: 3; }

    @media (max-width: 768px){
      .collage-grid{ grid-template-columns: 1fr; }
      .small-left,.small-right,.big-1,.big-2,.big-3{ grid-column:auto; }
      .hanger::before{ top:-70px; height:70px; }
    }
  </style>
</head>
<body>
  <!-- Fixed header styled like index page with RORO LAB -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-black/80 backdrop-blur border-b border-neutral-800">
    <div class="max-w-6xl mx-auto h-14 px-5 flex items-center justify-between">
      <a href="./index.html#home" class="font-extrabold tracking-tight text-xl text-cyan-400">
        <span class="text-cyan-400">RORO</span><span class="text-pink-400"> LAB</span>
      </a>
      <div class="hidden sm:flex gap-6 text-sm text-neutral-300">
        <a href="./index.html#home" class="hover:text-cyan-400">Home</a>
        <a href="./index.html#about" class="hover:text-cyan-400">About</a>
        <a href="./index.html#works" class="hover:text-cyan-400">Works</a>
      </div>
    </div>
  </nav>
  <div class="h-14"></div>

  <main class="relative mx-auto max-w-6xl px-5 sm:px-6 md:px-8 pt-12">
    <div class="rail" aria-hidden="true"></div>

    <header class="mb-8">
      <h1 class="text-3xl sm:text-4xl font-semibold text-white">Collage Photo Frame</h1>
      <p class="text-neutral-400">Five-image layout: two hanging, three grounded. No white borders.</p>
    </header>

    <div class="collage-grid">
      <div class="hanger small-left">
        <figure class="frame">
          <img src="./assets/preview/DSC01138_enhanced.jpg" alt="Top left" />
        </figure>
      </div>

      <div></div>

      <div class="hanger small-right">
        <figure class="frame">
          <img src="./assets/preview/DSC01140.JPG" alt="Top right" />
        </figure>
      </div>

      <figure class="frame big-1">
        <img src="./assets/preview/DSC01189.JPG" alt="Bottom left" />
      </figure>

      <figure class="frame big-2">
        <img src="./assets/preview/SDC10726.JPG" alt="Bottom center" />
      </figure>

      <figure class="frame big-3">
        <img src="./assets/preview/SDC10746.JPG" alt="Bottom right" />
      </figure>
    </div>

    <footer class="text-center text-xs text-neutral-500 mt-12 mb-8">
      &copy; 2025 RORO LAB. All Rights Reserved.
    </footer>
  </main>
</body>
</html>
