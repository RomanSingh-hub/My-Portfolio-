<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Collage Grid – RORO LAB</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top rail nav (simple) -->
  <header class="glass-effect" style="position:sticky;top:0;z-index:50">
    <nav class="navbar" style="max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;justify-content:space-between;align-items:center">
      <a href="index.html" class="logo neon-text" style="text-decoration:none;color:#fff;font-weight:800">
        <span style="color:#22d3ee">RORO</span> <span style="color:#f472b6">LAB</span>
      </a>
      <div class="nav-links" style="display:flex;gap:18px">
        <a href="index.html#home" class="btn-link">Home</a>
        <a href="index.html#works" class="btn-link">Works</a>
      </div>
    </nav>
  </header>

  <main style="max-width:1100px;margin:32px auto;padding:0 16px">
    <!-- ===== 3 equal columns: LEFT | CENTER | RIGHT ===== -->
    <div class="collage3">
      <!-- Left column: pic1 / pic4 -->
      <div class="col">
        <figure class="frame tall"><img src="assets/preview/SDC10726.JPG" alt="pic1"></figure>
        <figure class="frame tall"><img src="assets/preview/SDC10746.JPG" alt="pic4"></figure>
      </div>

      <!-- Center column: pic2 / instagram button / pic5 -->
      <div class="col">
        <figure class="frame tall"><img src="assets/preview/SDC10826.JPG" alt="pic2"></figure>

        <div class="frame short center-cell">
          <div class="center-glow" aria-hidden="true"></div>
          <a class="cta"
             href="https://instagram.com/romansingh1820?igsh=ZWR2dzM5aWRpd3Bh"
             target="_blank" rel="noopener">
            Follow RORO LAB on Instagram
          </a>
        </div>

        <figure class="frame tall"><img src="assets/preview/DSC01189.JPG" alt="pic5"></figure>
      </div>

      <!-- Right column: pic3 / pic6 -->
      <div class="col">
        <figure class="frame tall"><img src="assets/preview/DSC01138_enhanced.jpg" alt="pic3"></figure>
        <figure class="frame tall"><img src="assets/preview/DSC01140.JPG" alt="pic6"></figure>
      </div>
    </div>

    <p class="note-subtle">Tip: swap <code>assets/preview/*.jpg</code> for your images. No white edges—images use <code>object-fit:cover</code>.</p>
  </main>
</body>
</html>
